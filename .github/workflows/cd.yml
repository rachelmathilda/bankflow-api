name: bankflow-api CD

on:
  workflow_run:
    workflows: ["bankflow-api CI"]
    types:
      - completed
    branches: 
      - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        
        - name: Checkout repo
          uses: actions/checkout@v7
        
        - name: Login to DockerHub
          uses: docker/login-action@v2
          with: 
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with: 
            context: .
            push: true
            tags: ${{secrets.DOCKER_USERNAME}}/bankflow-api:latest
        
        - name: Trigger deploy to Render
          env:
            deploy_url: ${{secrets.RENDER_DEPLOY_URL}}
          run: |
            curl -X POST $deploy_url
        
        - name: Check health endpoint
          run: |
            sleep 10
            curl -f https://api.bankflow.id/health || exit 1