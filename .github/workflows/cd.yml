name: bankflow-api CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven
        - run: chmod +x ./mvnw
        - run: ./mvnw clean package -DskipTests